# Grafana (chart 10.5.15 = Grafana 12.3.1). Dashboards and the two alert rules come from
# ConfigMaps and values in Git; nothing is clicked together in the UI. No sidecar, so no
# Kubernetes API access and no service account token (CIS 5.1.6). No PVC (rules file,
# item 17): an emptyDir, so anything made in the UI is lost on restart, on purpose. No
# plugins (R5 tripwire). The admin password is generated by the chart into a Secret and is
# read with kubectl; reach Grafana by port-forward only, there is no ingress.
replicas: 1
automountServiceAccountToken: false
rbac:
  create: false
testFramework:
  enabled: false
initChownData:
  enabled: false
persistence:
  enabled: false
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}
# Grafana runs its database migrations at every start (the database is an emptyDir). That
# took about 2 minutes on the laptop's disk and tripped the liveness probe twice (the pod
# restarted). The startup probe gives it up to 5 minutes before liveness starts.
startupProbe:
  httpGet: {path: /api/health, port: grafana}
  periodSeconds: 10
  failureThreshold: 30
grafana.ini:
  analytics:
    check_for_updates: false
    reporting_enabled: false
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: forge-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: forge
        folder: Forge
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/forge
# key = provider folder name, value = ConfigMap made by apps/monitoring-config.yaml
dashboardsConfigMaps:
  forge: forge-dashboards
# The first ADR-002 alert (decision 4): fewer than 2 admission controller replicas answering.
# No Alertmanager and no contact point, so it shows in Grafana (Alerting, Alert rules) only;
# that is a recorded gap (ADR-002 decision 9). No data (every replica gone) counts as firing.
# The second ADR-002 alert, Kyverno webhook configurations missing, needs kube-state-metrics,
# which is not installed: also a recorded gap.
alerting:
  rules.yaml:
    apiVersion: 1
    groups:
      - orgId: 1
        name: kyverno-gate
        folder: Forge
        interval: 1m
        rules:
          - uid: kyverno-admission-replicas
            title: Fewer than 2 Kyverno admission replicas are answering
            condition: C
            for: 2m
            noDataState: Alerting
            execErrState: Alerting
            annotations:
              summary: ADR-002 decision 4 wants 2 admission replicas. With fewer, pod creation depends on one pod.
            labels:
              severity: critical
            data:
              - refId: A
                relativeTimeRange: {from: 300, to: 0}
                datasourceUid: forge-prometheus
                model:
                  refId: A
                  expr: count(up{job="kyverno-admission"} == 1) or vector(0)
                  instant: true
              - refId: B
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: {type: lt, params: [2]}
