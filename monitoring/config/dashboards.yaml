# The Grafana dashboards: Kyverno admission (kyverno.json) and Falco runtime (falco.json), both
# R5-compliant (dashboard JSON in a ConfigMap, no plugin). Grafana mounts the ConfigMap through
# `dashboardsConfigMaps` in monitoring/grafana-values.yaml. Edit the JSON here, never in the Grafana
# UI (the UI copy is read-only and lost on restart).
apiVersion: v1
kind: ConfigMap
metadata:
  name: forge-dashboards
  namespace: monitoring
data:
  kyverno.json: |
    {
      "uid": "forge-kyverno",
      "title": "Forge: Kyverno admission",
      "tags": [
        "forge",
        "kyverno"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "editable": false,
      "panels": [
        {
          "id": 1,
          "title": "Admission controller replicas up",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "forge-prometheus"
          },
          "description": "Targets of the kyverno-admission scrape job that answer. ADR-002 wants 2; below 2 the Grafana alert fires.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "forge-prometheus"
              },
              "expr": "count(up{job=\"kyverno-admission\"} == 1) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Admission requests per second: allowed vs refused",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "forge-prometheus"
          },
          "description": "A refusal leaves no Event and no PolicyReport (ADR-002 decision 9), so this counter is the only history.",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 18,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "forge-prometheus"
              },
              "expr": "sum by (request_allowed) (rate(kyverno_admission_requests_total[5m]))",
              "legendFormat": "allowed = {{request_allowed}}",
              "refId": "A",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Refused admission requests by namespace (selected range)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "forge-prometheus"
          },
          "description": "Requests the cluster refused, per namespace, over the time range chosen at the top.",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "forge-prometheus"
              },
              "expr": "sum by (resource_namespace) (increase(kyverno_admission_requests_total{request_allowed=\"false\"}[$__range]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "count"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "count",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Admission review latency",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "forge-prometheus"
          },
          "description": "How long Kyverno takes to answer an admission review (all policies together).",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "forge-prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(kyverno_admission_review_duration_seconds_bucket[5m])))",
              "legendFormat": "p50",
              "refId": "A",
              "instant": false,
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "forge-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(kyverno_admission_review_duration_seconds_bucket[5m])))",
              "legendFormat": "p95",
              "refId": "B",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "CIS/PSS policy results (selected range)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "forge-prometheus"
          },
          "description": "Results of the 17 pod security policies (ValidatingPolicy) per policy and result.",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "forge-prometheus"
              },
              "expr": "sum by (policy_name, result) (increase(kyverno_validating_policy_results_total[$__range]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "count"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "count",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "Image policy results (selected range)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "forge-prometheus"
          },
          "description": "Results of the three ECR image policies (signature, SBOM, scan freshness).",
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "forge-prometheus"
              },
              "expr": "sum by (policy_name, result) (increase(kyverno_image_validating_policy_results_total[$__range]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "count"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "count",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            },
            "overrides": []
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
  falco.json: |
    {
      "uid": "forge-falco",
      "title": "Forge: Falco runtime (Juice Shop)",
      "tags": [
        "forge",
        "falco"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "editable": false,
      "panels": [
        {
          "id": 1,
          "title": "Firing alerts",
          "type": "alertlist",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 7
          },
          "description": "Grafana alert rule 'Falco rule matched in Juice Shop' (monitoring/grafana-values.yaml). No Alertmanager: this list and Alerting > Alert rules are where alerts show.",
          "options": {
            "viewMode": "list",
            "groupMode": "default",
            "groupBy": [],
            "maxItems": 20,
            "sortOrder": 1,
            "dashboardAlerts": false,
            "alertName": "Falco",
            "alertInstanceLabelFilter": "",
            "stateFilter": {
              "firing": true,
              "pending": true,
              "noData": false,
              "normal": false,
              "error": true
            },
            "showInstances": true
          }
        },
        {
          "id": 2,
          "title": "Falcosidekick targets up",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "forge-prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 6,
            "h": 5
          },
          "description": "Targets of the falcosidekick scrape job that answer. 0 means the metric path is down (Falco may still run).",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "forge-prometheus"
              },
              "expr": "count(up{job=\"falcosidekick\"} == 1) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 3,
          "title": "Events since Falcosidekick started, by rule",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "forge-prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 7,
            "w": 18,
            "h": 5
          },
          "description": "Cumulative counter per rule (it restarts at 0 when Falcosidekick restarts). The cumulative form is used because rate() would miss the first event of a new series.",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "forge-prometheus"
              },
              "expr": "sum by (rule) (falcosecurity_falcosidekick_falco_events_total{k8s_ns_name=\"juice-shop\"})",
              "legendFormat": "{{rule}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "title": "Events by rule, pod and process",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "forge-prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 24,
            "h": 8
          },
          "description": "Counter totals since Falcosidekick started. The container runtime's own setup commands on kind (mount-product-files, jq, cp, mount) appear at every container start; they do not exist on EKS.",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "forge-prometheus"
              },
              "expr": "sum by (rule, priority_raw, k8s_pod_name, proc_name) (falcosecurity_falcosidekick_falco_events_total{k8s_ns_name=\"juice-shop\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "rule": "Rule",
                  "priority_raw": "Priority",
                  "k8s_pod_name": "Pod",
                  "proc_name": "Process",
                  "Value": "Events"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Events",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true
          }
        }
      ]
    }
