# Prints the mounted secret once, then idles. The value is a dummy made for this demo.
# The mount is read at pod start only, so a changed secret needs a pod restart.
# The image is busybox 1.37 from the Docker Official Images mirror on public ECR (not
# Docker Hub), pinned by digest. R2 will need a Kyverno exception or a signed image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-reader
  namespace: identity-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-reader
  template:
    metadata:
      labels:
        app: secret-reader
    spec:
      serviceAccountName: secret-reader
      # Required by the CIS policy forge-cis-sa-token. Not needed for the demo: the IRSA token
      # is projected by the EKS webhook and the CSI driver asks for its own. UNVERIFIED until EKS.
      automountServiceAccountToken: false
      containers:
        - name: reader
          image: public.ecr.aws/docker/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
            - |
              echo "mounted secret: $(cat /mnt/secrets/secret)"
              while true; do sleep 3600; done
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: demo-secret
