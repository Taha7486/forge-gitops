# The pod's name tag. The annotation tells EKS which IAM role to hand out for it. The
# role is created by Terraform (forge-infra, ephemeral/irsa_demo.tf, output
# demo_role_arn). ACCOUNT_ID is replaced once, when the AWS account exists. An account ID
# is an address, not a secret (AWS docs), so it may sit in this public repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: identity-demo
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/forge-identity-demo
