# What to fetch: one Parameter Store parameter, shown to the pod as the file "secret".
# The parameter is a SecureString made by hand; the role may read this name only.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: demo-secret
  namespace: identity-demo
spec:
  provider: aws
  parameters:
    region: eu-west-3
    objects: |
      - objectName: "/forge/demo/secret"
        objectType: "ssmparameter"
        objectAlias: "secret"
