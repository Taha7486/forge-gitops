# Deny ALL egress for every pod in this namespace. Juice Shop is deliberately vulnerable (its SSRF
# makes the server fetch any URL it is given) and needs no outbound connection, so with no egress
# rules a successful SSRF reaches nothing: not the internet, not the LAN, not the cloud metadata
# service (169.254.169.254). DNS is blocked too, which is fine: the app resolves nothing.
# Ingress is not restricted here (port-forward and probes keep working; replies to them are allowed).
# On kind (kindnet) this dropped the internet, the Docker gateway and the API ClusterIP (session 24).
# Not proven on EKS: the VPC CNI must have network policy support switched on, or this object is
# accepted and silently not enforced.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress
  namespace: juice-shop
spec:
  podSelector: {}
  policyTypes:
    - Egress
