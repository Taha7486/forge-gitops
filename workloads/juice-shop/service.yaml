# ClusterIP only: no load balancer (rules file, rule 16). Reach it with
#   kubectl -n juice-shop port-forward svc/juice-shop 3000:3000
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: juice-shop
spec:
  type: ClusterIP
  selector:
    app: juice-shop
  ports:
    - name: http
      port: 3000
      targetPort: http
