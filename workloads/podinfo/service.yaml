# ClusterIP only: no load balancer (rules file, rule 16). Reach it with
#   kubectl -n podinfo port-forward svc/podinfo 9898:9898
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: podinfo
spec:
  type: ClusterIP
  selector:
    app: podinfo
  ports:
    - name: http
      port: 9898
      targetPort: http
