# Phase 1 workload: the upstream podinfo image, same pin as forge-factory/Dockerfile.
# Phase 2 replaces it with the image built and signed by our own pipeline.
# To see "Git drives the cluster": change the UI message below, push, and watch it
# change in the podinfo UI (ArgoCD checks Git about every 3 minutes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: podinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      # The CIS/PSS policies in policies/ require these. The image's user "app" is not
      # numeric, so runAsNonRoot needs runAsUser: 100 (its uid) or the kubelet refuses to start it.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da
          ports:
            - name: http
              containerPort: 9898
          env:
            - name: PODINFO_UI_MESSAGE
              value: "Forge: hello from Git"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
