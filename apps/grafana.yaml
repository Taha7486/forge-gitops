# Grafana (community chart 13.2.6 = Grafana 13.2.2), values in monitoring/grafana-values.yaml.
# The old repo grafana.github.io/helm-charts ended at 10.5.15, which is marked deprecated; the
# maintained chart lives in grafana-community.github.io/helm-charts. Wave 3: the dashboard
# ConfigMap (apps/monitoring-config.yaml) and Prometheus (wave 2) must exist first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 13.2.6
      helm:
        releaseName: grafana
        valueFiles:
          - $values/monitoring/grafana-values.yaml
    - repoURL: https://github.com/Taha7486/forge-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
