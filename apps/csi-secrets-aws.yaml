# The helper that fetches a Parameter Store secret and mounts it in a pod: the AWS
# provider plus the Secrets Store CSI driver (chart 3.1.4 pulls in driver v1.6.1 through
# its Chart.lock; confirm the driver version from the running pods). It also installs the
# SecretProviderClass kind, so it must be Healthy before anything uses that kind: wave 0
# here, wave 1 on apps/identity-demo.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-secrets-aws
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://aws.github.io/secrets-store-csi-driver-provider-aws
    chart: secrets-store-csi-driver-provider-aws
    targetRevision: 3.1.4
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
