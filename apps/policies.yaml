# The three image policies for our ECR images (policies/). Wave 1: they use the
# ImageValidatingPolicy kind that apps/kyverno.yaml (wave 0) installs.
# SkipDryRunOnMissingResource is a second guard if ArgoCD checks it too early.
# The policies are cluster-scoped; the namespace below is only a placeholder for ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Taha7486/forge-gitops.git
    targetRevision: main
    path: policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
