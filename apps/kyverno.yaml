# Kyverno (R2, plan section R2). Chart 3.9.1 = Kyverno v1.19.1, values in kyverno/values.yaml.
# Wave 0: it installs the ImageValidatingPolicy kind that apps/policies.yaml (wave 1) uses.
# Release name and namespace must stay "kyverno": the IRSA trust rule in forge-infra names
# the service account kyverno/kyverno-admission-controller.
# ServerSideApply: Kyverno's docs recommend it with ArgoCD (the CRDs are large).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Without this the app stays OutOfSync for ever: 11 Kyverno CRDs (group policies.kyverno.io)
    # differ from the chart only by the `spec.conversion: {strategy: None}` default the API
    # server adds. Kyverno's docs recommend this setting; tested on kind 2026-10-16.
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.9.1
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/kyverno/values.yaml
    - repoURL: https://github.com/Taha7486/forge-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
