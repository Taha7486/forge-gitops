# Pod security policy 1 of 17 (PSS Baseline, CIS 5.2.2).
# No privileged containers.
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno and argocd are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-pss-privileged
  annotations:
    forge.dev/controls: "CIS 5.2.2; PSS baseline: Privileged Containers"
    policies.kyverno.io/title: Disallow privileged containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: offenders
      expression: >-
        variables.containers.filter(c, c.?securityContext.?privileged.orValue(false) ==
        true).map(c, c.name)
  validations:
    - expression: variables.offenders.size() == 0
      messageExpression: >-
        'privileged containers are not allowed (CIS 5.2.2, PSS baseline): ' +
        variables.offenders.join(', ')
