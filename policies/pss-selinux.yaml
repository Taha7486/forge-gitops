# Pod security policy 6 of 17 (PSS Baseline, no CIS control).
# SELinux type limited to the container types, user and role must be unset.
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno, argocd, monitoring and policy-reporter are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-pss-selinux
  annotations:
    forge.dev/controls: "PSS baseline: SELinux (no CIS control)"
    policies.kyverno.io/title: Restrict SELinux options
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd, monitoring, policy-reporter]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: allowedTypes
      expression: >-
        ['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t']
    - name: scopes
      expression: >-
        [{'name': dyn('pod'), 'o': object.spec.?securityContext.?seLinuxOptions.orValue({})}] +
        variables.containers.map(c, {'name': dyn(c.name), 'o':
        c.?securityContext.?seLinuxOptions.orValue({})})
    - name: offenders
      expression: >-
        variables.scopes.filter(s, !(s.o.?type.orValue('') in variables.allowedTypes) ||
        s.o.?user.orValue('') != '' || s.o.?role.orValue('') != '').map(s, s.name)
  validations:
    - expression: variables.offenders.size() == 0
      messageExpression: >-
        'custom SELinux options are not allowed (PSS baseline): ' +
        variables.offenders.join(', ')
