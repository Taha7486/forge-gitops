# Pod security policy 9 of 17 (PSS Restricted, CIS 5.2.6).
# Every container must set allowPrivilegeEscalation to false.
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno and argocd are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-pss-privilege-escalation
  annotations:
    forge.dev/controls: "CIS 5.2.6; PSS restricted: Privilege Escalation"
    policies.kyverno.io/title: Disallow privilege escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: offenders
      expression: >-
        variables.containers.filter(c,
        c.?securityContext.?allowPrivilegeEscalation.orValue(true) != false).map(c,
        c.name)
  validations:
    - expression: variables.offenders.size() == 0
      messageExpression: >-
        'allowPrivilegeEscalation must be false (CIS 5.2.6, PSS restricted) for: ' +
        variables.offenders.join(', ')
