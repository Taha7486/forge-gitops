# Pod security policy 13 of 17 (PSS Restricted, CIS 5.2.8, 5.2.9, 5.2.10).
# Every container must drop ALL and may add back only NET_BIND_SERVICE.
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno, argocd, monitoring, policy-reporter and falco are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-pss-capabilities
  annotations:
    forge.dev/controls: "CIS 5.2.8, 5.2.9, 5.2.10; PSS restricted: Capabilities"
    policies.kyverno.io/title: Drop all capabilities
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd, monitoring, policy-reporter, falco]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: nodrop
      expression: >-
        variables.containers.filter(c,
        !c.?securityContext.?capabilities.?drop.orValue([]).exists(d, d ==
        'ALL')).map(c, c.name)
    - name: badadd
      expression: >-
        variables.containers.filter(c,
        c.?securityContext.?capabilities.?add.orValue([]).exists(a, a !=
        'NET_BIND_SERVICE')).map(c, c.name)
  validations:
    - expression: variables.nodrop.size() == 0
      messageExpression: >-
        'capabilities must drop ALL (CIS 5.2.10, PSS restricted) for: ' +
        variables.nodrop.join(', ')
    - expression: variables.badadd.size() == 0
      messageExpression: >-
        'only NET_BIND_SERVICE may be added (CIS 5.2.8, 5.2.9, PSS restricted) for: ' +
        variables.badadd.join(', ')
