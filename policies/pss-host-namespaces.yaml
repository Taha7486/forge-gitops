# Pod security policy 2 of 17 (PSS Baseline, CIS 5.2.3, 5.2.4, 5.2.5).
# No hostNetwork, hostPID or hostIPC.
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno, argocd, monitoring and policy-reporter are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-pss-host-namespaces
  annotations:
    forge.dev/controls: "CIS 5.2.3, 5.2.4, 5.2.5; PSS baseline: Host Namespaces"
    policies.kyverno.io/title: Disallow host namespaces
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd, monitoring, policy-reporter]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: offenders
      expression: >-
        (object.spec.?hostNetwork.orValue(false) == true ? ['hostNetwork'] : []) +
        (object.spec.?hostPID.orValue(false) == true ? ['hostPID'] : []) +
        (object.spec.?hostIPC.orValue(false) == true ? ['hostIPC'] : [])
  validations:
    - expression: variables.offenders.size() == 0
      messageExpression: >-
        'sharing host namespaces is not allowed (CIS 5.2.3 to 5.2.5, PSS baseline): ' +
        variables.offenders.join(', ')
