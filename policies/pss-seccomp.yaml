# Pod security policy 12 of 17 (PSS Restricted, CIS 5.7.2).
# Seccomp type must be RuntimeDefault or Localhost, set on the pod or on every container.
# CIS 5.7.2 names docker/default, which is RuntimeDefault; Localhost is allowed by PSS.
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno and argocd are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-pss-seccomp
  annotations:
    forge.dev/controls: "CIS 5.7.2; PSS restricted: Seccomp"
    policies.kyverno.io/title: Require a seccomp profile
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: allowed
      expression: >-
        ['RuntimeDefault', 'Localhost']
    - name: podSeccomp
      expression: >-
        object.spec.?securityContext.?seccompProfile.?type.orValue('')
    - name: offenders
      expression: >-
        (variables.podSeccomp == '' || variables.podSeccomp in variables.allowed ? [] : ['pod'])
        + variables.containers.filter(c,
        !(c.?securityContext.?seccompProfile.?type.orValue(variables.podSeccomp) in
        variables.allowed)).map(c, c.name)
  validations:
    - expression: variables.offenders.size() == 0
      messageExpression: >-
        'a seccomp profile (RuntimeDefault or Localhost) is required (CIS 5.7.2, PSS restricted)
        for: ' + variables.offenders.join(', ')
