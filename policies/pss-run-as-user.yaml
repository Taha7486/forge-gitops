# Pod security policy 11 of 17 (PSS Restricted, CIS 5.2.7).
# runAsUser must not be 0, at pod or container level.
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno and argocd are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-pss-run-as-user
  annotations:
    forge.dev/controls: "CIS 5.2.7; PSS restricted: Running as Non-root user"
    policies.kyverno.io/title: Disallow UID 0
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: offenders
      expression: >-
        (object.spec.?securityContext.?runAsUser.orValue(1) == 0 ? ['pod'] : []) +
        variables.containers.filter(c, c.?securityContext.?runAsUser.orValue(1) ==
        0).map(c, c.name)
  validations:
    - expression: variables.offenders.size() == 0
      messageExpression: >-
        'runAsUser 0 is not allowed (CIS 5.2.7, PSS restricted): ' +
        variables.offenders.join(', ')
