# Pod security policy 10 of 17 (PSS Restricted, CIS 5.2.7).
# runAsNonRoot must be true on the pod or on every container (a container value wins).
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno, argocd, monitoring, policy-reporter and falco are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-pss-run-as-non-root
  annotations:
    forge.dev/controls: "CIS 5.2.7; PSS restricted: Running as Non-root"
    policies.kyverno.io/title: Require running as non-root
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd, monitoring, policy-reporter, falco]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: podNonRoot
      expression: >-
        object.spec.?securityContext.?runAsNonRoot.orValue(false)
    - name: offenders
      expression: >-
        variables.containers.filter(c,
        c.?securityContext.?runAsNonRoot.orValue(variables.podNonRoot) != true).map(c,
        c.name)
  validations:
    - expression: variables.offenders.size() == 0
      messageExpression: >-
        'runAsNonRoot must be true (CIS 5.2.7, PSS restricted) for: ' +
        variables.offenders.join(', ')
