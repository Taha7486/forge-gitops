# Pod security policy 17 of 17 (CIS only, CIS 5.1.6).
# automountServiceAccountToken must be false on the pod. A workload that needs the API
# gets a PolicyException in its own namespace, with a written reason.
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno, argocd, monitoring and policy-reporter are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-cis-sa-token
  annotations:
    forge.dev/controls: "CIS 5.1.6"
    policies.kyverno.io/title: Mount service account tokens only where necessary
    policies.kyverno.io/category: CIS Kubernetes Benchmark
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd, monitoring, policy-reporter]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  validations:
    - expression: object.spec.?automountServiceAccountToken.orValue(true) == false
      messageExpression: >-
        'set automountServiceAccountToken: false (CIS 5.1.6)'
