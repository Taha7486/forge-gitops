# Pod security policy 5 of 17 (PSS Baseline, no CIS control).
# AppArmor profile type must be unset, RuntimeDefault or Localhost (field and legacy annotation).
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno, argocd, monitoring and policy-reporter are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-pss-apparmor
  annotations:
    forge.dev/controls: "PSS baseline: AppArmor (no CIS control)"
    policies.kyverno.io/title: Restrict AppArmor profiles
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd, monitoring, policy-reporter]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: allowed
      expression: >-
        ['RuntimeDefault', 'Localhost']
    - name: offenders
      expression: >-
        (object.spec.?securityContext.?appArmorProfile.?type.orValue('RuntimeDefault') in
        variables.allowed ? [] : ['pod']) + variables.containers.filter(c,
        !(c.?securityContext.?appArmorProfile.?type.orValue('RuntimeDefault') in
        variables.allowed)).map(c, c.name) +
        object.metadata.?annotations.orValue({}).filter(k,
        k.startsWith('container.apparmor.security.beta.kubernetes.io/') &&
        !(object.metadata.annotations[k] == 'runtime/default' ||
        object.metadata.annotations[k].startsWith('localhost/')))
  validations:
    - expression: variables.offenders.size() == 0
      messageExpression: >-
        'this AppArmor profile is not allowed (PSS baseline): ' + variables.offenders.join(', ')
