# Pod security policy 3 of 17 (PSS Baseline, CIS 5.2.13).
# No hostPort on any container.
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno, argocd, monitoring and policy-reporter are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-pss-host-ports
  annotations:
    forge.dev/controls: "CIS 5.2.13; PSS baseline: Host Ports"
    policies.kyverno.io/title: Disallow host ports
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd, monitoring, policy-reporter]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: offenders
      expression: >-
        variables.containers.filter(c, c.?ports.orValue([]).exists(p, p.?hostPort.orValue(0) >
        0)).map(c, c.name)
  validations:
    - expression: variables.offenders.size() == 0
      messageExpression: >-
        'host ports are not allowed (CIS 5.2.13, PSS baseline): ' +
        variables.offenders.join(', ')
