# Pod security policy 16 of 17 (CIS only, CIS 5.4.1).
# No secretKeyRef or secretRef in a container's environment; mount the secret instead.
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno, argocd, monitoring, policy-reporter and falco are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-cis-secrets-as-files
  annotations:
    forge.dev/controls: "CIS 5.4.1"
    policies.kyverno.io/title: Prefer secrets as files over environment variables
    policies.kyverno.io/category: CIS Kubernetes Benchmark
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd, monitoring, policy-reporter, falco]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: offenders
      expression: >-
        variables.containers.filter(c, c.?env.orValue([]).exists(e,
        e.?valueFrom.?secretKeyRef.hasValue()) || c.?envFrom.orValue([]).exists(e,
        e.?secretRef.hasValue())).map(c, c.name)
  validations:
    - expression: variables.offenders.size() == 0
      messageExpression: >-
        'secrets must be mounted as files, not environment variables (CIS 5.4.1) in: ' +
        variables.offenders.join(', ')
