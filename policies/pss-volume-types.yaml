# Pod security policy 14 of 17 (PSS Restricted, no CIS control).
# Every volume must be one of the types the restricted profile permits.
# Matches Pod creation; Deployments, StatefulSets, DaemonSets, Jobs and CronJobs through
# autogen. Ephemeral containers are not covered (see README). Namespaces kube-system,
# kube-node-lease, kube-public, kyverno, argocd, monitoring and policy-reporter are excluded.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forge-pss-volume-types
  annotations:
    forge.dev/controls: "PSS restricted: Volume Types (no CIS control)"
    policies.kyverno.io/title: Restrict volume types
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny, Audit]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, argocd, monitoring, policy-reporter]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: allowed
      expression: >-
        ['configMap', 'csi', 'downwardAPI', 'emptyDir', 'ephemeral', 'persistentVolumeClaim',
        'projected', 'secret']
    - name: offenders
      expression: >-
        object.spec.?volumes.orValue([]).filter(v, !v.exists(k, k in variables.allowed)).map(v,
        v.name)
  validations:
    - expression: variables.offenders.size() == 0
      messageExpression: >-
        'this volume type is not allowed (PSS restricted): ' + variables.offenders.join(', ')
