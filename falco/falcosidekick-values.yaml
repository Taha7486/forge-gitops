# Falcosidekick (chart 0.14.0, image 2.32.0). It receives Falco's JSON events and does one thing
# here: count them as Prometheus metrics (/metrics on port 2801), so Grafana can alert on them. The
# counter falcosecurity_falcosidekick_falco_events_total already carries rule, priority, k8s_ns_name
# and k8s_pod_name; listing k8s.pod.name again as an extra label makes Falcosidekick panic at start
# (duplicate label names, seen on kind 2026-10-17), so only the process name is added. No other output is configured, so nothing leaves the cluster.
# One replica: two nodes, and a lost event stream is a gap in the demo, not in the gate.
replicaCount: 1
resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 64Mi}
config:
  prometheus:
    extralabels: "proc.name"
