apiVersion: batch/v1
kind: CronJob
metadata:
  name: pass-cronjob
  namespace: pt
spec:
  schedule: 0 0 * * *
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: app
            image: ghcr.io/stefanprodan/podinfo:6.15.0
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
          restartPolicy: Never
