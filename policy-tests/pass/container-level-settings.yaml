apiVersion: v1
kind: Pod
metadata:
  name: pass-container-level-settings
  namespace: pt
spec:
  automountServiceAccountToken: false
  securityContext: {}
  containers:
  - name: app
    image: ghcr.io/stefanprodan/podinfo:6.15.0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      runAsNonRoot: true
      runAsUser: 10001
      seccompProfile:
        type: RuntimeDefault
      appArmorProfile:
        type: RuntimeDefault
      seLinuxOptions:
        type: container_t
      privileged: false
      procMount: Default
