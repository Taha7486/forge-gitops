apiVersion: v1
kind: Pod
metadata:
  name: fail-container
  namespace: pt
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: ghcr.io/stefanprodan/podinfo:6.15.0
    securityContext:
      capabilities:
        drop:
        - ALL
      privileged: true
