apiVersion: v1
kind: Pod
metadata:
  name: fail-pod
  namespace: default
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: ghcr.io/stefanprodan/podinfo:6.15.0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
