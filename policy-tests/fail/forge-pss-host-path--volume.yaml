apiVersion: v1
kind: Pod
metadata:
  name: fail-volume
  namespace: pt
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: ghcr.io/stefanprodan/podinfo:6.15.0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    volumeMounts:
    - name: h
      mountPath: /h
  volumes:
  - name: h
    hostPath:
      path: /etc
