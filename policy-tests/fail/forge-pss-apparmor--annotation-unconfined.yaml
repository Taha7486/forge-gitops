apiVersion: v1
kind: Pod
metadata:
  name: fail-annotation-unconfined
  namespace: pt
  annotations:
    container.apparmor.security.beta.kubernetes.io/app: unconfined
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: ghcr.io/stefanprodan/podinfo:6.15.0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
