apiVersion: v1
kind: Pod
metadata:
  name: fail-env
  namespace: pt
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: ghcr.io/stefanprodan/podinfo:6.15.0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    env:
    - name: T
      valueFrom:
        secretKeyRef:
          name: s
          key: k
