apiVersion: apps/v1
kind: Deployment
metadata:
  name: fail-deployment
  namespace: pt
spec:
  replicas: 1
  selector:
    matchLabels: {app: fail-deployment}
  template:
    metadata:
      labels: {app: fail-deployment}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: docker.io/library/nginx:1.27-alpine
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
