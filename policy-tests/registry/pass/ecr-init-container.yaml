apiVersion: v1
kind: Pod
metadata:
  name: pass-ecr-init-container
  namespace: pt
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: 123456789012.dkr.ecr.eu-west-3.amazonaws.com/forge/podinfo:6.15.0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
  initContainers:
  - name: setup
    image: 123456789012.dkr.ecr.eu-west-3.amazonaws.com/forge/podinfo:6.15.0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
